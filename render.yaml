services:
  - type: web
    name: sendpaper
    runtime: node
    plan: free  # upgrade to starter after the first real order (free sleeps when idle)
    region: oregon
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase: { name: sendpaper-db, property: connectionString }
      - key: BASE_URL
        value: https://sendmypaper.com
      - key: ADMIN_TOKEN
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFY_EMAIL
        sync: false

databases:
  - name: sendpaper-db
    plan: basic-256mb  # upgraded from free 2026-10-02 (free expired 2026-10-31)
    region: oregon
    databaseName: sendpaper
